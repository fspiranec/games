<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mali doktor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:#173b52;font-family:'Nunito',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;background:linear-gradient(180deg,#dff4ff 0 70%,#bfe3f2 70% 100%)}
body.blood{background:radial-gradient(1200px 700px at 50% 50%,#ff9a9a,#d94a5a)}
#sign{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:44px;height:44px;background:#fff;border-radius:12px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:39}
#sign:before,#sign:after{content:'';position:absolute;background:#e63946;border-radius:3px}
#sign:before{width:28px;height:9px}#sign:after{width:9px;height:28px}
body.blood #sign{display:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 68px);left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:8px 20px;font:800 clamp(18px,4.4vw,24px)/1.2 'Baloo 2',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.1);white-space:nowrap;z-index:20}
#prog{position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);left:0;right:0;text-align:center;font-size:24px;letter-spacing:4px;z-index:20}
#stage{position:fixed;inset:0;overflow:hidden}
#patient{position:absolute;z-index:3;transition:filter .8s}
#patient svg{width:100%;height:100%;display:block}
#patient.sick{filter:saturate(.55) hue-rotate(-25deg) brightness(.97)}
#patient.happy{animation:happy .7s 2}
@keyframes happy{30%{transform:translateY(-24px) scale(1.04)}60%{transform:translateY(0) scale(.98)}}
#mood{position:absolute;font-size:clamp(40px,9vw,64px);line-height:1;transition:transform .3s}
#mood.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.5)}}
#bed{position:absolute;border-radius:24px;background:#fff;box-shadow:0 8px 0 #9cc9dd,0 14px 30px rgba(0,0,0,.12)}
body.blood #bed{display:none}
.germ{position:absolute;cursor:pointer;z-index:5}
.germ svg{width:100%;height:100%;display:block;animation:wob 1.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08,.94)}}
.germ.hidden{opacity:0;pointer-events:none}
.germ.found{animation:found .5s}
@keyframes found{0%{transform:scale(.2)}60%{transform:scale(1.3)}}
.germ.giggle svg{animation:gig .15s 5}
@keyframes gig{50%{transform:translateX(6px) rotate(10deg)}}
.germ.poof{transition:transform .35s ease-in,opacity .35s;transform:scale(0) rotate(180deg);opacity:0;pointer-events:none}
.fx{position:absolute;pointer-events:none;z-index:8;border-radius:50%;animation:fx .7s ease-out forwards}
@keyframes fx{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.rbc{position:absolute;z-index:2;cursor:pointer}
.rbc svg{width:100%;height:100%;display:block}
#hero{position:absolute;z-index:7;pointer-events:none;transition:left .45s cubic-bezier(.4,1.3,.6,1),top .45s cubic-bezier(.4,1.3,.6,1)}
#hero svg{width:100%;height:100%}
#hero.chomp svg{animation:chomp .4s}
@keyframes chomp{40%{transform:scale(1.3,.8)}}
#tray{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:14px;z-index:20;pointer-events:none}
.tool{pointer-events:auto;width:clamp(74px,18vw,104px);aspect-ratio:1;border-radius:26px;border:5px solid #fff;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 13px/1.1 'Nunito',sans-serif;color:#173b52;cursor:pointer;gap:2px;position:relative}
.tool .ic{font-size:clamp(36px,9vw,50px);line-height:1}
.tool.sel{border-color:var(--c,#ff6b4a);transform:translateY(-8px);box-shadow:0 0 0 4px var(--c,#ff6b4a),0 10px 20px rgba(0,0,0,.18)}
.tool .ic svg{width:clamp(44px,11vw,62px);height:auto;display:block}
#lens{position:absolute;width:150px;height:150px;border-radius:50%;border:10px solid #5b6b78;background:rgba(220,245,255,.25);box-shadow:inset 0 0 20px rgba(255,255,255,.8),0 6px 14px rgba(0,0,0,.25);pointer-events:none;z-index:9;transform:translate(-50%,-50%);display:none}
#lens:after{content:'';position:absolute;width:16px;height:60px;background:#5b6b78;border-radius:8px;right:-34px;bottom:-56px;transform:rotate(-45deg)}
#owie{position:absolute;z-index:4;pointer-events:none}
#owie .spot{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#ff5a5a 0 45%,rgba(255,90,90,.35) 46% 70%,transparent 71%);animation:owie 1s infinite}
@keyframes owie{50%{transform:scale(1.15)}}
#owie .pl{position:absolute;inset:-10% -40%;display:none;place-items:center}
#owie.done .spot{display:none}#owie.done .pl{display:grid}
#thermo{position:absolute;z-index:9;background:#fff;border-radius:20px;padding:6px 14px;font:800 30px/1 'Baloo 2',sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none}
.drag{position:fixed;z-index:30;pointer-events:none;font-size:64px;line-height:1;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="sign"></div>
<div id="stage"><div id="bed"></div><div id="patient"></div><div id="mood"></div><div id="owie"><div class="spot"></div><div class="pl"></div></div><div id="thermo"></div><div id="lens"></div><div id="hero"></div></div>
<div id="hint"></div>
<div id="prog"></div>
<div id="tray"></div>
<script src="../_shared/kids.js"></script>
<script>
/* ---------- crteži klica ---------- */
const eyes = (x1, x2, y) => `<circle cx="${x1}" cy="${y}" r="7" fill="#fff"/><circle cx="${x2}" cy="${y}" r="7" fill="#fff"/><circle cx="${x1 + 1.5}" cy="${y + 1}" r="3.6" fill="#222"/><circle cx="${x2 + 1.5}" cy="${y + 1}" r="3.6" fill="#222"/>`;
function bacteriaSVG(c) {
  const d = K.dark(c, 0.3), l = K.light(c, 0.4);
  return `<svg viewBox="0 0 100 100"><g transform="rotate(-18 50 50)">
    <path d="M14 50 q-6 -8 -12 -2 M86 50 q6 -8 12 -2 M30 31 q-2 -10 -8 -12 M70 69 q2 10 8 12" stroke="${d}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="12" y="30" width="76" height="40" rx="20" fill="${c}" stroke="${d}" stroke-width="3"/>
    <circle cx="24" cy="44" r="4" fill="${l}"/><circle cx="76" cy="58" r="5" fill="${l}"/><circle cx="72" cy="40" r="3" fill="${l}"/>
    ${eyes(41, 59, 45)}<path d="M41 58 Q50 66 59 58" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>`;
}
function virusSVG(c) {
  const d = K.dark(c, 0.3), l = K.light(c, 0.4);
  let spikes = '';
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2, x1 = 50 + Math.cos(a) * 28, y1 = 50 + Math.sin(a) * 28, x2 = 50 + Math.cos(a) * 42, y2 = 50 + Math.sin(a) * 42;
    spikes += `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${d}" stroke-width="4"/><circle cx="${x2}" cy="${y2}" r="5.5" fill="${l}" stroke="${d}" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 100 100">${spikes}<circle cx="50" cy="50" r="30" fill="${c}" stroke="${d}" stroke-width="3"/>
    <circle cx="38" cy="66" r="4" fill="${l}"/><circle cx="66" cy="36" r="3" fill="${l}"/>
    ${eyes(41, 59, 46)}<path d="M40 58 Q50 67 60 58 Z" fill="#222"/><path d="M45 59 l2 4 l2 -4 M51 59 l2 4 l2 -4" fill="#fff"/></svg>`;
}
const BAC_COLS = ['#7ccf4a', '#b5d93a', '#3fbf8f'], VIR_COLS = ['#a77bdb', '#e05fbf', '#7f6bff'];
function rbcSVG() { return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="46" ry="40" fill="#e0303f"/><ellipse cx="50" cy="50" rx="24" ry="20" fill="#b81f2e"/><ellipse cx="36" cy="32" rx="10" ry="5" fill="#ff7a85" opacity=".6"/></svg>`; }
function heroSVG() {
  return `<svg viewBox="0 0 100 100"><path d="M50 8 C75 6 94 26 92 50 C96 72 76 94 50 92 C26 96 6 76 8 50 C4 28 24 8 50 8Z" fill="#fdfdff" stroke="#c9d6ea" stroke-width="4"/>
    <circle cx="30" cy="30" r="7" fill="#e7ecff"/><circle cx="72" cy="70" r="9" fill="#e7ecff"/>
    ${eyes(40, 60, 44)}<path d="M36 58 Q50 72 64 58 Z" fill="#ff6b6b"/>
    <path d="M30 22 q8 -10 18 -4" stroke="#4aa3df" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
}

/* ---------- razine ---------- */
const LEVELS = [
  { name: 'Klice', steps: ['zap'], germs: 5, patients: 3 },
  { name: 'Bakterija ili virus?', steps: ['zap2'], germs: 6, patients: 3 },
  { name: 'Povećalo', steps: ['find', 'zap'], germs: 5, patients: 3 },
  { name: 'Pregled', steps: ['thermo', 'find', 'zap2', 'plaster'], germs: 5, patients: 3 },
  { name: 'U krvi', blood: true, germs: 8, patients: 2 },
  { name: 'Brze klice', steps: ['zap2'], germs: 5, patients: 3, move: true, multiply: true },
];
let level = 0, L = LEVELS[0], patientNo = 0, germs = [], tool = null, step = null, running = false, box = null, last = 0, splitT = 0, cells = [], explainedRbc = false;
const stage = document.getElementById('stage'), patientEl = document.getElementById('patient'), moodEl = document.getElementById('mood'),
  hint = document.getElementById('hint'), tray = document.getElementById('tray'), lens = document.getElementById('lens'),
  owie = document.getElementById('owie'), thermo = document.getElementById('thermo'), hero = document.getElementById('hero'), bed = document.getElementById('bed');

K.bar({ levels: menu });
function menu() { stop(); K.levelMenu('doktor', 'Mali doktor', LEVELS, start); }
function stop() { running = false; germs.forEach((g) => g.el.remove()); germs = []; cells.forEach((c) => c.el.remove()); cells = []; tray.innerHTML = ''; lens.style.display = 'none'; }
function setHint(t, say) { hint.textContent = t; if (say !== false) K.say(say || t); }
function prog() { document.getElementById('prog').textContent = '🤒'.repeat(L.patients - patientNo) + '😄'.repeat(patientNo); }

function start(i) {
  stop(); level = i; L = LEVELS[i]; patientNo = 0;
  document.body.classList.toggle('blood', !!L.blood);
  prog(); nextPatient();
}

function layoutPatient() {
  const W = innerWidth, H = innerHeight, top = 150, bottom = 140;
  const s = Math.min(W * 0.78, H - top - bottom, 460);
  box = { x: (W - s) / 2, y: top + (H - top - bottom - s) / 2, s };
  Object.assign(patientEl.style, { left: box.x + 'px', top: box.y + 'px', width: s + 'px', height: s + 'px' });
  Object.assign(bed.style, { left: box.x - s * 0.08 + 'px', top: box.y + s * 0.84 + 'px', width: s * 1.16 + 'px', height: s * 0.22 + 'px' });
  Object.assign(moodEl.style, { left: box.x + s * 0.8 + 'px', top: box.y + s * 0.02 + 'px' });
}
addEventListener('resize', () => { if (!L.blood && box) { const old = box; layoutPatient(); germs.forEach((g) => { g.x = box.x + ((g.x - old.x) / old.s) * box.s; g.y = box.y + ((g.y - old.y) / old.s) * box.s; g.size = box.s * 0.17; place(g); }); } });

async function nextPatient() {
  running = true;
  if (L.blood) return bloodRound();
  const isPup = Math.random() < 0.5;
  patientEl.innerHTML = isPup ? K.pup(K.pick(K.PUPS)) : K.dino(K.pick(['rex', 'trike', 'longneck', 'stego']), K.pick(Object.values(K.COLORS)));
  step = null; splitT = 5; patientEl.className = 'sick'; moodEl.textContent = '🤒';
  owie.className = ''; owie.style.display = 'none'; thermo.style.display = 'none';
  layoutPatient();
  K.say(K.pick(['Doktore, nije mi dobro!', 'Doktore, boli me!', 'Pomoć, doktore!']));
  await K.wait(900);
  spawnGerms(L.germs, L.steps.includes('find'));
  for (const s of L.steps) { if (!running) return; await STEPS[s](); }
  if (!running) return;
  healed();
}

function spawnGerms(n, hidden) {
  for (let i = 0; i < n; i++) addGerm(null, hidden);
}
function addGerm(near, hidden) {
  const twoTypes = L.steps && L.steps.includes('zap2');
  const type = twoTypes ? (germs.filter((g) => g.type === 'b').length <= germs.filter((g) => g.type === 'v').length ? 'b' : 'v') : K.pick(['b', 'v']);
  const el = document.createElement('div');
  el.className = 'germ' + (hidden ? ' hidden' : '');
  el.innerHTML = type === 'b' ? bacteriaSVG(K.pick(BAC_COLS)) : virusSVG(K.pick(VIR_COLS));
  el.style.setProperty('--d', -Math.random() * 1.4 + 's');
  const size = box.s * 0.17;
  let x, y, tries = 0;
  do {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.36;
    x = near ? near.x + K.rnd(-40, 40) : box.x + box.s * (0.5 + Math.cos(a) * r);
    y = near ? near.y + K.rnd(-40, 40) : box.y + box.s * (0.52 + Math.sin(a) * r * 0.9);
    tries++;
  } while (tries < 30 && germs.some((g) => Math.hypot(g.x - x, g.y - y) < size * 0.9));
  const g = { el, type, x, y, size, vx: K.rnd(-50, 50), vy: K.rnd(-50, 50), found: !hidden, dead: false };
  place(g);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); hitGerm(g); });
  stage.appendChild(el); germs.push(g);
  return g;
}
function place(g) { Object.assign(g.el.style, { left: g.x - g.size / 2 + 'px', top: g.y - g.size / 2 + 'px', width: g.size + 'px', height: g.size + 'px' }); }

/* ---------- koraci pregleda ---------- */
let resolveStep = null;
const waitStep = () => new Promise((r) => (resolveStep = r));
function done() { const r = resolveStep; resolveStep = null; r && r(); }

function toolBtn(icon, label, color, onSel) {
  const b = document.createElement('button');
  b.className = 'tool'; b.style.setProperty('--c', color || '#ff6b4a');
  b.innerHTML = `<span class="ic">${icon}</span>${label}`;
  b.onclick = () => { K.sfx('tap'); tray.querySelectorAll('.tool').forEach((x) => x.classList.toggle('sel', x === b)); onSel && onSel(); };
  tray.appendChild(b); return b;
}

// povuci alat (emoji) na cilj
function dragTool(btn, icon, targetRect, onHit) {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const ghost = document.createElement('div'); ghost.className = 'drag'; ghost.textContent = icon;
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    document.body.appendChild(ghost);
    let moved = false; const sx = e.clientX, sy = e.clientY;
    const mv = (ev) => { if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 8) moved = true; ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; };
    const up = (ev) => {
      removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
      ghost.remove();
      const r = targetRect();
      if (!moved || (ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom)) onHit();
    };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}

const STEPS = {
  async thermo() {
    step = 'thermo';
    tray.innerHTML = '';
    const b = toolBtn('🌡️', 'Toplomjer');
    setHint('Izmjeri temperaturu!');
    dragTool(b, '🌡️', () => patientEl.getBoundingClientRect(), async () => {
      if (!resolveStep) return;
      K.sfx('peek');
      Object.assign(thermo.style, { display: 'block', left: box.x + box.s * 0.05 + 'px', top: box.y + box.s * 0.1 + 'px' });
      thermo.textContent = '🌡️ 38°';
      setHint('Ima temperaturu! Imaš posla.', 'Ima temperaturu!');
      await K.wait(1600); thermo.style.display = 'none'; done();
    });
    await waitStep();
  },
  async find() {
    step = 'find';
    tray.innerHTML = '';
    toolBtn('🔍', 'Povećalo').classList.add('sel');
    setHint('Potraži klice povećalom!');
    lens.style.display = 'block';
    lens.style.left = innerWidth / 2 + 'px'; lens.style.top = box.y + box.s * 0.5 + 'px';
    const move = (e) => {
      lens.style.left = e.clientX + 'px'; lens.style.top = e.clientY - 40 + 'px';
      const lx = e.clientX, ly = e.clientY - 40;
      for (const g of germs) if (!g.found && Math.hypot(g.x - lx, g.y - ly) < 70) {
        g.found = true; g.el.classList.remove('hidden'); g.el.classList.add('found'); K.sfx('peek');
        K.say(g.type === 'b' ? 'Bakterija!' : 'Virus!');
      }
      if (germs.every((g) => g.found) && resolveStep) { removeEventListener('pointermove', move); setTimeout(() => { lens.style.display = 'none'; done(); }, 600); }
    };
    addEventListener('pointermove', move);
    await waitStep();
  },
  async zap() {
    step = 'zap';
    tray.innerHTML = ''; tool = 'hand';
    setHint('Dodirni klice da nestanu!');
    await waitStep();
  },
  async zap2() {
    step = 'zap';
    tray.innerHTML = ''; tool = null;
    toolBtn(`${bacteriaSVG('#7ccf4a')}`, 'Za bakterije', '#4caf50', () => { tool = 'b'; K.say('Sprej za bakterije!'); });
    toolBtn(`${virusSVG('#a77bdb')}`, 'Za viruse', '#9c5bd1', () => { tool = 'v'; K.say('Sprej za viruse!'); });
    setHint('Odaberi sprej pa dodirni klice!');
    await waitStep();
  },
  async plaster() {
    step = 'plaster';
    tray.innerHTML = '';
    Object.assign(owie.style, { display: 'block', left: box.x + box.s * 0.44 + 'px', top: box.y + box.s * 0.6 + 'px', width: box.s * 0.12 + 'px', height: box.s * 0.12 + 'px' });
    owie.querySelector('.pl').innerHTML = `<span style="font-size:${box.s * 0.14}px;line-height:1">🩹</span>`;
    const b = toolBtn('🩹', 'Flaster');
    setHint('Zalijepi flaster na ranicu!');
    dragTool(b, '🩹', () => { const r = owie.getBoundingClientRect(); return { left: r.left - 40, right: r.right + 40, top: r.top - 40, bottom: r.bottom + 40 }; }, () => {
      if (!resolveStep) return;
      owie.classList.add('done'); K.sfx('snap'); K.say('Tako. Sad je bolje!'); setTimeout(done, 900);
    });
    await waitStep();
  },
};

function hitGerm(g) {
  if (!running || g.dead || !g.found) return;
  if (L.blood) return heroEat(g);
  if (step !== 'zap') return;
  if (!tool) { K.sfx('boing'); setHint('Prvo odaberi sprej!'); return; }
  if (tool !== 'hand' && tool !== g.type) {
    K.sfx('boing'); g.el.classList.remove('giggle'); void g.el.offsetWidth; g.el.classList.add('giggle');
    setHint(g.type === 'b' ? 'To je bakterija! Uzmi zeleni sprej.' : 'To je virus! Uzmi ljubičasti sprej.');
    return;
  }
  kill(g, tool === 'v' ? '#c9a7ff' : tool === 'b' ? '#bff08f' : '#ffffff');
}
function kill(g, color) {
  g.dead = true; K.sfx('pop');
  burst(g.x, g.y, color);
  g.el.classList.add('poof'); setTimeout(() => g.el.remove(), 400);
  germs = germs.filter((x) => x !== g);
  if (!germs.length) setTimeout(() => (L.blood ? bloodDone() : done()), 500);
}
function burst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div'); p.className = 'fx';
    const a = (i / 10) * Math.PI * 2, d = K.rnd(30, 70), s = K.rnd(10, 22);
    p.style.cssText = `left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px;background:${color};border:2px solid rgba(255,255,255,.9);--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px`;
    stage.appendChild(p); setTimeout(() => p.remove(), 750);
  }
}

async function healed() {
  tray.innerHTML = ''; tool = null;
  patientEl.className = 'happy'; moodEl.textContent = '😄'; moodEl.classList.remove('pop'); void moodEl.offsetWidth; moodEl.classList.add('pop');
  Object.assign(thermo.style, { display: 'block', left: box.x + box.s * 0.05 + 'px', top: box.y + box.s * 0.1 + 'px' }); thermo.textContent = L.steps.includes('thermo') ? '🌡️ 36,6°' : '⭐';
  K.sfx('good'); K.say('Hvala, doktore!'); setHint('Hvala, doktore!', false);
  patientNo++; prog();
  await K.wait(2200);
  if (!running) return;
  thermo.style.display = 'none';
  if (patientNo >= L.patients) { running = false; K.levelComplete('doktor', level, LEVELS.length, start, menu, 'Svi pacijenti su zdravi!'); }
  else nextPatient();
}

/* ---------- pomicanje i dijeljenje klica ---------- */
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running && L.move && box) {
    for (const g of germs) {
      if (g.dead) continue;
      g.x += g.vx * dt; g.y += g.vy * dt;
      const cx = box.x + box.s * 0.5, cy = box.y + box.s * 0.52, R = box.s * 0.38;
      if (Math.hypot(g.x - cx, g.y - cy) > R) { g.vx = (cx - g.x) * 0.4 + K.rnd(-20, 20); g.vy = (cy - g.y) * 0.4 + K.rnd(-20, 20); }
      place(g);
    }
    if (L.multiply && resolveStep && germs.length) {
      splitT -= dt;
      if (splitT <= 0) {
        splitT = 5;
        if (germs.length < 9) { const p = K.pick(germs); addGerm(p, false); K.sfx('squeak'); }
      }
    }
  }
  if (running && L.blood) bloodStep(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame((t) => { last = t; loop(t); });

/* ---------- razina u krvi ---------- */
let caught = 0;
function bloodRound() {
  box = { x: 0, y: 0, s: Math.min(innerWidth, innerHeight) };
  patientEl.innerHTML = ''; moodEl.textContent = ''; owie.style.display = 'none'; thermo.style.display = 'none';
  tray.innerHTML = ''; caught = 0;
  document.getElementById('prog').textContent = '🦠'.repeat(L.germs);
  hero.innerHTML = heroSVG();
  const hs = Math.min(110, innerWidth * 0.2);
  Object.assign(hero.style, { width: hs + 'px', height: hs + 'px', left: innerWidth / 2 - hs / 2 + 'px', top: innerHeight - hs - 30 + 'px' });
  for (let i = 0; i < 9; i++) addCell(K.rnd(0, innerWidth));
  for (let i = 0; i < 4; i++) addFloatingGerm(K.rnd(0, innerWidth * 0.8));
  setHint('Dodirni klice! Bijela stanica ih pojede.', 'Ovo je tvoja krv. Dodirni klice, a bijela krvna stanica će ih pojesti!');
}
function addCell(x) {
  const el = document.createElement('div'); el.className = 'rbc'; el.innerHTML = rbcSVG();
  const s = K.rnd(60, 100);
  const c = { el, x, y: K.rnd(150, innerHeight - 160), s, v: K.rnd(40, 70), r: K.rnd(0, 360), vr: K.rnd(-30, 30) };
  el.style.width = s + 'px'; el.style.height = s * 0.85 + 'px';
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); K.sfx('boing');
    if (!explainedRbc) { explainedRbc = true; setHint('To je crvena krvna stanica. Ona je dobra!'); }
  });
  stage.appendChild(el); cells.push(c);
}
function addFloatingGerm(x) {
  const type = K.pick(['b', 'v']);
  const el = document.createElement('div'); el.className = 'germ';
  el.innerHTML = type === 'b' ? bacteriaSVG(K.pick(BAC_COLS)) : virusSVG(K.pick(VIR_COLS));
  el.style.setProperty('--d', -Math.random() * 1.4 + 's');
  const g = { el, type, x: x == null ? -60 : x, y: K.rnd(170, innerHeight - 190), size: Math.min(90, innerWidth * 0.16), v: K.rnd(45, 80), ph: Math.random() * 6, found: true, dead: false };
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); heroEat(g); });
  stage.appendChild(el); germs.push(g); place(g);
}
function bloodStep(dt) {
  for (const c of cells) {
    c.x += c.v * dt; c.r += c.vr * dt;
    if (c.x > innerWidth + 60) { c.x = -c.s; c.y = K.rnd(150, innerHeight - 160); }
    c.el.style.transform = `translate(${c.x}px,${c.y}px) rotate(${c.r}deg)`;
  }
  for (const g of germs) {
    if (g.dead) continue;
    g.x += g.v * dt; g.ph += dt * 2; g.y += Math.sin(g.ph) * 20 * dt;
    if (g.x > innerWidth + 60) g.x = -60;
    place(g);
  }
}
let heroBusy = false;
async function heroEat(g) {
  if (!running || g.dead || heroBusy) return;
  heroBusy = true; g.dead = true; g.v = 0;
  const hs = parseFloat(hero.style.width);
  hero.style.left = g.x - hs / 2 + 'px'; hero.style.top = g.y - hs / 2 + 'px';
  await K.wait(430);
  hero.classList.remove('chomp'); void hero.offsetWidth; hero.classList.add('chomp');
  K.sfx('munch'); burst(g.x, g.y, '#ffffff');
  g.el.classList.add('poof'); setTimeout(() => g.el.remove(), 400);
  germs = germs.filter((x) => x !== g);
  caught++;
  document.getElementById('prog').textContent = '🦠'.repeat(Math.max(0, L.germs - caught)) + '⭐'.repeat(caught);
  heroBusy = false;
  if (caught >= L.germs) return bloodDone();
  if (germs.length < 4) addFloatingGerm();
}
async function bloodDone() {
  running = false;
  K.sfx('good'); K.say('Bravo! Krv je čista!'); setHint('Bravo! Krv je čista!', false);
  patientNo++;
  await K.wait(1800);
  germs.forEach((g) => g.el.remove()); germs = []; cells.forEach((c) => c.el.remove()); cells = [];
  if (patientNo >= L.patients) K.levelComplete('doktor', level, LEVELS.length, start, menu, 'Pobijedio si sve klice!');
  else { running = true; bloodRound(); }
}
menu();
