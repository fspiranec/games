<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Izlegni jaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 500px at 50% 110%,#f6d48f,transparent),linear-gradient(180deg,#ffd7c2,#fff0cf);color:#173b52;font-family:'Nunito',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;text-align:center;font:800 26px/1.1 'Baloo 2',sans-serif;color:#8a4b2a}
#prog{position:fixed;top:calc(env(safe-area-inset-top,0px) + 104px);left:0;right:0;text-align:center;font-size:28px;letter-spacing:6px}
#nestArea{position:fixed;left:0;right:0;top:150px;bottom:130px}
.egg{position:absolute;width:var(--w);height:calc(var(--w)*1.3);cursor:pointer;transition:left .45s cubic-bezier(.3,1.4,.6,1),top .45s cubic-bezier(.3,1.4,.6,1)}
.egg svg{width:100%;height:100%;overflow:visible;display:block}
.egg.hit{animation:hit .3s}
.egg.wiggle{animation:wiggle .9s infinite}
@keyframes hit{30%{transform:scale(1.08,.92) rotate(-5deg)}60%{transform:scale(.96,1.05) rotate(4deg)}}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-5deg)}}
.egg .top{transition:transform .8s cubic-bezier(.2,.7,.4,1),opacity .8s}
.egg.open .top{transform:translate(40px,-160px) rotate(60deg);opacity:0}
.egg .top,.egg .baby{transform-box:fill-box}
.egg .baby{transform-origin:50% 100%;transform:translateY(40px) scale(.2);opacity:0;transition:transform .7s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.egg.open .baby{transform:translateY(-38px) scale(1);opacity:1}
#shelf{position:fixed;left:0;right:0;bottom:0;height:120px;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 8px);background:linear-gradient(180deg,#b97a45,#8f5a2e);display:flex;align-items:flex-end;justify-content:center;gap:4px;overflow:hidden;box-shadow:inset 0 8px 0 #d39a63}
#shelf .b{width:min(80px,11vw);aspect-ratio:1;cursor:pointer;flex:0 0 auto}
#shelf .b svg{width:100%;height:100%}
#shelf .b.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-24px)}}
#count{position:fixed;right:14px;bottom:126px;background:#fff;border-radius:999px;padding:4px 12px;font:800 16px 'Nunito',sans-serif;color:#8a4b2a}
</style>
</head>
<body>
<div id="hint"></div>
<div id="prog"></div>
<div id="nestArea"></div>
<div id="count"></div>
<div id="shelf"></div>
<script src="../_shared/kids.js"></script>
<script>
document.title = K.t('Izlegni jaje', 'Hatch the egg');
const LEVELS = [
  { name: K.t('3 kucanja', '3 taps'), taps: 3, eggs: 3 },
  { name: K.t('5 kucanja', '5 taps'), taps: 5, eggs: 3 },
  { name: K.t('Jaje skače', 'Jumping egg'), taps: 5, eggs: 3, jump: true },
  { name: K.t('Koje se miče?', 'Which one wiggles?'), taps: 4, eggs: 3, decoys: 1 },
  { name: K.t('Koje se miče? · 3', 'Which one wiggles? · 3'), taps: 4, eggs: 3, decoys: 2 },
  { name: K.t('Super jaje', 'Super egg'), taps: 8, eggs: 4, jump: true, decoys: 1 },
];
const SPOTS = ['#ff7eb6', '#4aa3df', '#6cc04a', '#a77bdb', '#ff9a3c', '#2ec4b6'];
let level = 0, hatched = 0, eggs = [], busy = false, uid = 0;
let babies = K.store.get('jaje-bebe', []);
const area = document.getElementById('nestArea'), hint = document.getElementById('hint');

K.bar({ levels: menu });
function menu() { K.levelMenu('jaje', K.t('Izlegni jaje', 'Hatch the egg'), LEVELS, start); }
function cfg() {
  const L = LEVELS[level], h = K.hard('jaje');
  return Object.assign({}, L, { taps: Math.max(2, Math.round(L.taps * (h ? 1.6 : 0.7))), jump: L.jump || h });
}
function start(i) { level = i; hatched = 0; prog(); newRound(); }
function prog() { document.getElementById('prog').textContent = '🥚'.repeat(LEVELS[level].eggs - hatched) + '🦖'.repeat(hatched); }

const EGG = 'M50 5 C80 5 95 60 95 85 C95 112 75 127 50 127 C25 127 5 112 5 85 C5 60 20 5 50 5Z';
const ZZ = '0,70 12,60 24,72 36,60 48,72 60,60 72,72 84,60 96,72 100,66';
const CRACKS = ['M50 20 L44 30 L52 36 L46 46', 'M70 30 L62 40 L70 48 L64 58', 'M28 34 L36 44 L30 52 L38 62', 'M52 48 L60 56 L54 64'];
function eggSVG(col, baby) {
  const id = 'e' + uid++;
  const spots = `<circle cx="32" cy="40" r="7" fill="${col}"/><circle cx="64" cy="26" r="5" fill="${col}"/><circle cx="72" cy="92" r="9" fill="${col}"/><circle cx="34" cy="100" r="6" fill="${col}"/><circle cx="56" cy="62" r="5" fill="${col}"/>`;
  const shell = `<path d="${EGG}" fill="#fffaf0" stroke="#e8d8bd" stroke-width="3"/>${spots}`;
  return `<svg viewBox="0 0 100 130"><defs>
      <clipPath id="${id}t"><polygon points="0,-60 100,-60 ${ZZ.split(' ').reverse().join(' ')}"/></clipPath>
      <clipPath id="${id}b"><polygon points="${ZZ} 100,140 0,140"/></clipPath></defs>
    <ellipse cx="50" cy="126" rx="44" ry="7" fill="rgba(0,0,0,.12)"/>
    <g class="baby"><svg x="0" y="20" width="100" height="100" viewBox="0 0 100 100">${K.dinoInner(baby.k, baby.c)}</svg></g>
    <g clip-path="url(#${id}b)">${shell}</g>
    <g class="top"><g clip-path="url(#${id}t)">${shell}</g></g>
    <g class="cracks" stroke="#8a6a44" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">${CRACKS.map((d) => `<path d="${d}" opacity="0"/>`).join('')}</g>
  </svg>`;
}

function place(e) {
  const r = area.getBoundingClientRect(), w = e.w, h = w * 1.3;
  e.x = K.rnd(10, Math.max(10, r.width - w - 10)); e.y = K.rnd(0, Math.max(0, r.height - h));
  e.el.style.left = e.x + 'px'; e.el.style.top = e.y + 'px';
}

function newRound() {
  busy = false; area.innerHTML = ''; eggs = [];
  const L = cfg(), n = 1 + (L.decoys || 0);
  const r = area.getBoundingClientRect();
  const w = Math.min(n > 1 ? 150 : 210, r.height / 1.45, (r.width - 40) / n);
  const real = Math.floor(Math.random() * n);
  for (let i = 0; i < n; i++) {
    const baby = { k: K.pick(K.DINO_KINDS), c: K.pick(Object.values(K.COLORS)) };
    const el = document.createElement('div');
    el.className = 'egg'; el.style.setProperty('--w', w + 'px');
    el.innerHTML = eggSVG(K.pick(SPOTS), baby);
    const e = { el, baby, real: i === real, taps: 0, w };
    if (n === 1 || L.jump) place(e);
    else { e.el.style.left = (r.width / n) * i + (r.width / n - w) / 2 + 'px'; e.el.style.top = (r.height - w * 1.3) / 2 + 'px'; }
    if (n === 1) { e.el.style.left = (r.width - w) / 2 + 'px'; e.el.style.top = (r.height - w * 1.3) / 2 + 'px'; }
    if (e.real && n > 1) el.classList.add('wiggle');
    el.addEventListener('pointerdown', (ev) => { ev.preventDefault(); tap(e); });
    area.appendChild(el); eggs.push(e);
  }
  hint.textContent = n > 1 ? K.t('Koje se jaje miče?', 'Which egg is wiggling?') : K.t('Kucni jaje!', 'Tap the egg!');
  K.say(n > 1 ? K.t('Koje se jaje miče?', 'Which egg is wiggling?') : K.t('Kucni jaje!', 'Tap the egg!'));
}

async function tap(e) {
  if (busy) return;
  const L = cfg();
  if (!e.real) { K.sfx('boing'); e.el.classList.remove('hit'); void e.el.offsetWidth; e.el.classList.add('hit'); return; }
  e.taps++;
  K.sfx('crack');
  e.el.classList.remove('hit'); void e.el.offsetWidth; e.el.classList.add('hit');
  const show = Math.ceil((e.taps / L.taps) * CRACKS.length);
  e.el.querySelectorAll('.cracks path').forEach((p, i) => p.setAttribute('opacity', i < show ? 1 : 0));
  if (e.taps < L.taps) {
    if (L.jump) { await K.wait(150); place(e); }
    return;
  }
  busy = true;
  e.el.classList.remove('wiggle');
  eggs.filter((x) => x !== e).forEach((x) => (x.el.style.opacity = '0.3'));
  e.el.querySelector('.cracks').style.display = 'none';
  await K.wait(200);
  e.el.classList.add('open'); K.sfx('squeak');
  K.say(K.t('Bok! Ja sam ', "Hi! I'm a ") + K.DINO_NAMES[e.baby.k] + '!');
  hint.textContent = K.DINO_NAMES[e.baby.k] + '!';
  hatched++; prog();
  babies.push(e.baby); babies = babies.slice(-60); K.store.set('jaje-bebe', babies); renderShelf();
  await K.wait(2400);
  if (hatched >= L.eggs) K.levelComplete('jaje', level, LEVELS.length, start, menu, K.t('Izlegli su se svi dinosauri!', 'All the dinosaurs hatched!'));
  else newRound();
}

function renderShelf() {
  const shelf = document.getElementById('shelf');
  const max = Math.max(3, Math.floor((innerWidth - 24) / Math.min(84, innerWidth * 0.11 + 4)));
  shelf.innerHTML = '';
  babies.slice(-max).forEach((b) => {
    const el = document.createElement('div'); el.className = 'b'; el.innerHTML = K.dino(b.k, b.c);
    el.onclick = () => { K.sfx('squeak'); el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); };
    shelf.appendChild(el);
  });
  document.getElementById('count').textContent = '🦖 ' + babies.length;
}
addEventListener('resize', renderShelf);
renderShelf();
menu();
</script>
</body>
</html>
