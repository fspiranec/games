<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igre</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#06324d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --bg:#06324d; --card:#f6fcff; --ink:#0b2a3c; --mute:#4d6b7c; --accent:#ff6b4a; --title:#f6fcff; --sub:#a9d3e4;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#0f7fa3,transparent),var(--bg);color:var(--ink);font-family:var(--body)}
header{max-width:1100px;margin:0 auto;padding:48px 16px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:1;margin:0;color:var(--title)}
h1 span{color:var(--accent)}
header p{margin:10px 0 0;color:var(--sub);font-size:17px}
main{max-width:1100px;margin:0 auto;padding:8px 16px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.game{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 14px 40px rgba(0,20,35,.4);transition:transform .15s,box-shadow .15s}
.game:hover,.game:focus-visible{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,20,35,.55)}
.game:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.game img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;background:#cfe4ee}
.game div{padding:14px 18px 18px}
.game h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;margin:0}
.game p{margin:6px 0 0;color:var(--mute);font-size:15px;line-height:1.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lang{border:0;border-radius:999px;padding:10px 18px;background:rgba(255,255,255,.94);color:#173b52;font:800 17px var(--body);cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap}
#install{background:#ffd23f}
.offline{margin:8px 0 0;color:#9be59b;font-size:15px}
.group{grid-column:1/-1;margin:24px 0 0;font-family:var(--display);font-weight:800;font-size:28px;color:var(--title)}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="h1"></h1><div class="btns"><button id="install" class="lang" hidden></button><button id="lang" class="lang"></button></div></div>
  <p id="sub"></p>
  <p id="offline" class="offline" hidden></p>
</header>
<main id="list"></main>
<script src="games/_shared/kids.js"></script>
<script>
/* Dodaj novu igru: stavi je u games/<ime>/index.html, sliku u games/<ime>/thumb.(svg|png|jpg) i dodaj red ovdje.
   Tekst piši kao K.t('hrvatski', 'English'). */
const t = (slug) => `games/${slug}/thumb.svg`;
document.title = K.t('Igre', 'Games');
document.getElementById('h1').innerHTML = K.t('Moje <span>igre</span>', 'My <span>games</span>');
document.getElementById('sub').textContent = K.t('Odaberi igru i zaigraj.', 'Pick a game and play.');
const lb = document.getElementById('lang');
lb.textContent = '🗣️ ' + K.LANGS.find((l) => l.code === K.lang).label;
lb.onclick = K.langMenu;

// instalacija kao aplikacija + oznaka da sve radi bez interneta
const ib = document.getElementById('install');
let installEvt = null;
addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); installEvt = e;
  ib.textContent = '📲 ' + K.t('Instaliraj', 'Install'); ib.hidden = false;
});
ib.onclick = async () => {
  if (!installEvt) return installHelp();
  installEvt.prompt(); await installEvt.userChoice; installEvt = null; ib.hidden = true;
};
// ako preglednik ne ponudi instalaciju sam, pokaži upute
function installHelp() {
  K.css();
  const ov = document.createElement('div'); ov.className = 'k-ov';
  ov.innerHTML = `<div class="k-card" style="text-align:left"><h2 style="text-align:center">📲 ${K.t('Instalacija', 'Install')}</h2>
    <p>${K.t('Otvori ovu stranicu u <b>Chromeu</b> (ne u Facebooku, WhatsAppu ili Gmailu), pa:', 'Open this page in <b>Chrome</b> (not inside Facebook, WhatsApp or Gmail), then:')}</p>
    <p>1. ${K.t('Dodirni izbornik <b>⋮</b> gore desno', 'Tap the <b>⋮</b> menu at the top right')}<br>2. ${K.t('Odaberi <b>Instaliraj aplikaciju</b> ili <b>Dodaj na početni zaslon</b>', 'Choose <b>Install app</b> or <b>Add to Home screen</b>')}<br>3. ${K.t('Otvori igre s ikone na početnom zaslonu', 'Open the games from the home-screen icon')}</p>
    <p>${K.t('Koristi glavnu adresu stranice (npr. ime-projekta.vercel.app), ne dugu adresu pojedine verzije.', 'Use the main site address (e.g. project-name.vercel.app), not a long per-deployment address.')}</p>
    <div class="k-row"><button class="k-big">OK</button></div></div>`;
  ov.querySelector('button').onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
}
if (!matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) {
  ib.textContent = '📲 ' + K.t('Instaliraj', 'Install'); ib.hidden = false;
}
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.ready.then(() => {
    const o = document.getElementById('offline');
    o.textContent = '✓ ' + K.t('Igre su spremljene i rade i bez interneta.', 'Games are saved and work without internet.');
    o.hidden = false;
  });
}
const GAMES = [
  { name: 'Bijeg od kita', desc: K.t('Plivaj kroz more i izbjegni velika usta kita.', 'Swim through the sea and escape the whale. (Croatian only)'), path: 'games/bijeg-od-kita/', thumb: t('bijeg-od-kita') },
  { name: K.t('Jan i T-Rex: Lava', 'Jan and T-Rex: Lava'), desc: K.t('Jaši T-Rexa i preskači lavu što dalje možeš.', 'Ride the T-Rex and jump over the lava as far as you can.'), path: 'games/jan-i-trex-lava/', thumb: t('jan-i-trex-lava') },
  { group: K.t('Za najmlađe (2–4 godine)', 'For little ones (ages 2–4)') },
  { name: K.t('Mali doktor', 'Little doctor'), desc: K.t('Pregledaj pacijente, nađi bakterije i viruse povećalom i otjeraj ih. Pa u krv s bijelom krvnom stanicom!', 'Examine patients, find bacteria and viruses with a magnifier and chase them away. Then dive into the blood with a white blood cell!'), path: 'games/mali-doktor/', thumb: t('mali-doktor') },
  { name: K.t('Memorija', 'Memory'), desc: K.t('Pronađi parove: dinosauri, psići, farma, more i vozila. Igraj sam, u dvoje ili protiv dina.', 'Find the pairs: dinosaurs, puppies, farm, sea and vehicles. Play alone, with a friend or against the dino.'), path: 'games/memorija/', thumb: t('memorija') },
  { name: K.t('Hrani dinosaura', 'Feed the dino'), desc: K.t('Dino je gladan! Daj mu hranu prave boje ili oblika.', 'The dino is hungry! Give it food of the right colour or shape.'), path: 'games/hrani-dinosaura/', thumb: t('hrani-dinosaura') },
  { name: K.t('Pronađi sjenu', 'Find the shadow'), desc: K.t('Čija je ovo sjena? Spoji životinju s njezinom sjenom.', 'Whose shadow is this? Match each animal to its shadow.'), path: 'games/pronadi-sjenu/', thumb: t('pronadi-sjenu') },
  { name: K.t('Balončići', 'Balloons'), desc: K.t('Pucaj balone, broji do deset i traži boje.', 'Pop balloons, count to ten and find colours.'), path: 'games/balonci/', thumb: t('balonci') },
  { name: K.t('Tko se skriva?', 'Who is hiding?'), desc: K.t('Pronađi životinju skrivenu iza grma, kamena ili kutije.', 'Find the animal hiding behind a bush, rock or box.'), path: 'games/tko-se-skriva/', thumb: t('tko-se-skriva') },
  { name: K.t('Izlegni jaje', 'Hatch the egg'), desc: K.t('Kucaj po jajetu dok se ne izlegne mali dinosaur.', 'Tap the egg until a baby dinosaur hatches.'), path: 'games/izlegni-jaje/', thumb: t('izlegni-jaje') },
  { name: K.t('Slagalica', 'Puzzle'), desc: K.t('Složi sliku od 2 do 16 dijelova.', 'Put together a picture from 2 to 16 pieces.'), path: 'games/slagalica/', thumb: t('slagalica') },
  { name: K.t('Bojanka', 'Colouring'), desc: K.t('Odaberi boju i dodirni dio slike.', 'Pick a colour and tap part of the picture.'), path: 'games/bojanka/', thumb: t('bojanka') },
];

const list = document.getElementById('list');
for (const g of GAMES) {
  if (g.group) { const h = document.createElement('h3'); h.className = 'group'; h.textContent = g.group; list.appendChild(h); continue; }
  const a = document.createElement('a');
  a.className = 'game';
  a.href = g.path;
  a.innerHTML = `<img src="${g.thumb}" alt="" loading="lazy"><div><h2></h2><p></p></div>`;
  a.querySelector('h2').textContent = g.name;
  a.querySelector('p').textContent = g.desc || '';
  list.appendChild(a);
}
</script>
</body>
</html>
